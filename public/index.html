<style>
:root{--bg:#a9bfca;--ink:#20333a;--green:#78ad82;--green2:#a9d3a6;--yellow:#ffd85a;--cream:#fff8df;--red:#ef735e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:linear-gradient(145deg,#9fb8c4,#c3d2d2);font-family:"Arial Rounded MT Bold","PingFang SC",sans-serif;color:var(--ink);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}body{display:grid;place-items:center}
.app{width:min(100%,520px);height:100dvh;padding:max(12px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;position:relative;overflow:hidden}.screen{display:none;flex:1;min-height:0;flex-direction:column}.screen.active{display:flex}.brand{text-align:center;font-weight:900;font-size:clamp(34px,10vw,52px);letter-spacing:3px;color:#fef8df;text-shadow:3px 4px 0 #54747a,0 0 1px #20333a;margin:18px 0 12px}.duck{font-size:105px;text-align:center;filter:drop-shadow(0 7px 0 #78949a);margin:25px 0}.loading-bar{height:18px;border:3px solid #55757d;border-radius:99px;background:#e4eee6;overflow:hidden;box-shadow:inset 0 2px 3px #79939a}.loading-fill{height:100%;width:0;background:var(--yellow);transition:width .2s}.loading-label{text-align:center;font-weight:700;margin-top:10px}
.topbar{display:flex;justify-content:space-between;align-items:center;background:#e7f0dd;border:3px solid #587a79;border-radius:18px;padding:10px 14px;box-shadow:0 5px 0 #78969a;margin-bottom:14px}.score strong{font-size:25px}.rank{font-weight:900;color:#537d5d;font-size:18px}.panel{background:rgba(255,248,223,.75);border:3px solid #68888a;border-radius:25px;padding:22px;box-shadow:0 6px 0 #829da0}.home .panel{text-align:center;margin-top:25px}.home h2{font-size:27px;margin:0 0 10px}.home p{line-height:1.7;margin:10px 0 20px}.button{border:0;border-bottom:5px solid #b58f2e;border-radius:18px;padding:14px 24px;background:var(--yellow);color:#594b26;font:900 21px inherit;cursor:pointer;box-shadow:0 2px 0 #fff8c1;transition:.12s}.button:active{transform:translateY(3px);border-bottom-width:2px}.small-btn{font-size:15px;padding:9px 12px;border-radius:12px;border-bottom-width:3px}.mode-actions{display:grid;gap:11px}.mode-actions .button{width:100%;font-size:18px;padding:12px}.load-action{width:100%;margin-top:12px}.home-footer{margin-top:auto;display:flex;justify-content:center;gap:10px;padding-top:20px}.secondary{background:#e6f0e4;border-color:#698889;color:var(--ink);border-bottom-color:#718e8a}
.fuse{height:19px;background:#dce9d6;border:3px solid #587a79;border-radius:99px;overflow:hidden;margin-bottom:7px;position:relative;flex:none}.fuse i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ef6f54,#ffd558);transform-origin:left}.fuse:after{content:"✦";position:absolute;right:2px;top:-8px;font-size:23px;color:#fff0a2}.game-score{text-align:center;font-weight:900;margin:-4px 0 7px;flex:none}.timer-label{text-align:center;font-size:14px;font-weight:800;margin-bottom:7px;flex:none}.board{--cell-gap:7px;--cell-size:min(calc((100vw - 117px) / 10),calc((100dvh - 350px) / 16),48px);display:grid;grid-template-columns:repeat(10,var(--cell-size));grid-template-rows:repeat(16,var(--cell-size));gap:var(--cell-gap);width:max-content;align-self:center;background:#147a58;padding:6px;border:4px solid #8b6223;border-radius:18px;box-shadow:0 5px 0 #6d8e88;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:relative}.cell{width:var(--cell-size);height:var(--cell-size);background:#f9f8e8;border:1px solid #dedcc9;border-radius:2px;display:grid;place-items:center;font-size:clamp(14px,calc(var(--cell-size) * .57),24px);font-weight:900;color:#182527;cursor:pointer;transition:.08s;box-shadow:none}.cell.selected{background:#f9f8e8;border-color:#dedcc9;transform:none;box-shadow:none}.cell.empty{background:transparent;border-color:transparent;box-shadow:none;cursor:default}.selection-outline{position:absolute;border:1px solid #ffe15a;border-radius:3px;background:transparent;pointer-events:none;z-index:2;transition:left .04s,top .04s,width .04s,height .04s}.ten-effect{position:absolute;display:grid;place-items:center;width:clamp(32px,calc(var(--cell-size) * 1.25),52px);height:clamp(32px,calc(var(--cell-size) * 1.25),52px);border:2px solid #c3962b;border-radius:5px;background:#ffe66a;color:#243033;font-size:clamp(18px,calc(var(--cell-size) * .7),30px);font-weight:900;box-shadow:2px 3px 0 #96702c;pointer-events:none;z-index:4;animation:ten-pop .8s ease-out forwards}@keyframes ten-pop{0%{opacity:0;transform:translate(-50%,-20%) scale(.45) rotate(-8deg)}25%{opacity:1;transform:translate(-50%,-55%) scale(1.1) rotate(5deg)}100%{opacity:0;transform:translate(-50%,-165%) scale(.88) rotate(-4deg)}}.toolbox{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;flex:none}#game .toolbox{grid-template-columns:repeat(2,1fr)}.tool{border:2px solid #587a79;border-radius:12px;padding:7px 3px;background:#e8f0df;color:#20333a;font:800 12px inherit;cursor:pointer;box-shadow:0 3px 0 #78969a;white-space:nowrap}.tool:active{transform:translateY(2px);box-shadow:0 1px 0 #78969a}.tool.on{background:#ffd85a}.hint{animation:pulse .55s ease-in-out 3}@keyframes pulse{50%{background:#ffdd56;transform:scale(1.1)}}
@media (max-height:720px){.app{padding-top:8px;padding-bottom:8px}.topbar{padding:7px 12px;margin-bottom:8px}.score strong{font-size:21px}.fuse{height:16px}.toolbox{margin-top:7px}.tool{padding:5px}.game-score,.timer-label{margin-bottom:4px}}
.effects-layer{position:absolute;inset:0;z-index:4;pointer-events:none}.modal-wrap{position:absolute;inset:0;background:#213c3d88;display:grid;place-items:center;padding:22px;z-index:5}.modal{max-width:420px;background:var(--cream);border:4px solid #587a79;border-radius:25px;padding:25px;box-shadow:0 8px 0 #496c70;text-align:center}.modal h2{margin:0 0 12px}.modal p{line-height:1.75;text-align:left}.settings-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}.settings-actions .button{width:100%;padding:10px 4px;font-size:15px}.leaderboard{padding-top:12px}.leaderboard h1{text-align:center;margin:8px 0 16px}.leaderboard-list{background:#f9f8e8;border:3px solid #587a79;border-radius:16px;overflow:auto;max-height:65dvh}.leaderboard-row{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;padding:11px 12px;border-bottom:1px solid #ccd6c9;font-weight:800}.leaderboard-row:last-child{border-bottom:0}.leaderboard-row small{display:block;font-weight:600;color:#587a79;margin-top:2px}.leaderboard-score{font-size:22px;color:#bd733d}.leaderboard-empty{text-align:center;padding:28px 14px;color:#587a79}.result{text-align:center;margin:auto 0}.result .duck{font-size:75px;margin:10px}.result h1{font-size:34px;margin:8px}.result .big{font-size:42px;font-weight:900;color:#bd733d}.actions{display:flex;justify-content:center;gap:10px;margin-top:25px}.hidden{display:none!important}
</style></head>
<body><main class="app">
<section id="loading" class="screen"><div></div></section>
<section id="home" class="screen home active"><div class="topbar"><div class="score">当前智力<br><strong id="totalScore">0</strong></div><div class="rank" id="homeRank">托儿所</div></div><div class="panel"><h2>开局托儿所</h2><p>框选区域内的数字，让总和等于 <b>10</b>。选得越多，分数越高！</p><div class="mode-actions"><button class="button" id="defaultBtn">默认模式</button><button class="button secondary" id="countdownBtn">倒计时模式</button><button class="button secondary" id="stopwatchBtn">计时模式</button></div><button class="button secondary small-btn load-action" id="loadBtn">读取进度</button><button class="button secondary small-btn load-action" id="rulesBtn">游戏说明</button><button class="button secondary small-btn load-action" id="leaderboardBtn">排行榜</button></div></section>
<section id="leaderboard" class="screen leaderboard"><h1>排行榜</h1><div class="leaderboard-list" id="leaderboardList"><div class="leaderboard-empty">正在加载…</div></div><div class="actions"><button class="button secondary" id="leaderboardHome">返回首页</button></div></section>
<section id="game" class="screen"><div class="topbar"><div class="score">当前智力<br><strong id="roundScore">0</strong></div><div class="rank" id="gameRank">托儿所</div></div><div class="fuse"><i id="fuseFill"></i></div><div class="timer-label" id="timerLabel">自由模式</div><div class="game-score">拖动框选区域 · 区域总和：<span id="selectionSum">0</span></div><div class="board" id="board"></div><div class="toolbox"><button class="tool" id="shuffleBtn">🔀 洗牌</button><button class="tool" id="settingsBtn">⚙ 设置</button></div></section>
<section id="result" class="screen result"><div class="duck">🐥</div><h1 id="resultTitle">本局结束！</h1><p>本局智力</p><div class="big" id="finalRound">0</div><p id="finalDuration">本局用时：0 秒</p><p>总智力：<b id="finalTotal">0</b><br>学历称号：<b id="finalRank">托儿所</b></p><p id="finalRecordStatus">本局数据正在保存…</p><button class="button secondary small-btn" id="resultLeaderboard">查看排行榜</button><div class="actions"><button class="button" id="againBtn">再来一局</button><button class="button secondary" id="homeBtn">返回首页</button></div></section>
<div class="effects-layer" id="effectsLayer"></div>
<div class="modal-wrap hidden" id="settingsModal"><div class="modal"><h2>设置</h2><p>可保存当前棋盘，或管理本局游戏。</p><div class="settings-actions"><button class="button secondary small-btn" id="settingsResume">继续游戏</button><button class="button secondary small-btn" id="settingsSave">保存进度</button><button class="button secondary small-btn" id="settingsPause">暂停计时</button><button class="button secondary small-btn" id="settingsRestart">重新开始</button><button class="button small-btn" id="settingsEnd">结束游戏</button><button class="button secondary small-btn" id="settingsHome">返回主页</button></div></div></div>
<div class="modal-wrap hidden" id="rulesModal"><div class="modal"><h2>游戏说明</h2><p>拖动框选一个矩形区域，区域内所有未消除数字的总和正好等于 10，即可消除。</p><p>空位不会计入总和。可使用洗牌整理棋盘；倒计时模式在 60 秒后结束，计时模式会记录本局总用时。</p><button class="button" id="rulesClose">我知道了</button></div></div>
</main><script>
const $ = s => document.querySelector(s);
const screens = [...document.querySelectorAll('.screen')];
const ROWS = 16, COLS = 10, ROUND_SECONDS = 60, GRID_GAP = 7;
const MODE_LABELS = { default: '默认模式', countdown: '倒计时模式', stopwatch: '计时模式' };
const clientId = localStorage.getItem('sum-ten-client-id') || crypto.randomUUID();
localStorage.setItem('sum-ten-client-id', clientId);
let grid = [], selected = [], selectionStart = null, selectionEnd = null, drag = false, round = 0, total = 0, time = ROUND_SECONDS, elapsed = 0, timer = null, mode = 'default', paused = false, gameEnded = false, lastRecordSync = Promise.resolve(false);

const rank = score => score < 100 ? '托儿所' : score < 300 ? '小学' : score < 600 ? '中学' : '大学';
function show(id) { screens.forEach(screen => screen.classList.toggle('active', screen.id === id)); }
function newGrid() { grid = Array.from({ length: ROWS }, () => Array.from({ length: COLS }, () => 1 + Math.floor(Math.random() * 9))); }
function isSelected(row, col) { return selected.some(([r, c]) => r === row && c === col); }
function selectionSum() { return selected.reduce((sum, [row, col]) => sum + grid[row][col], 0); }
function updateSum() { $('#selectionSum').textContent = selectionSum(); }
function updateTimer() {
  const label = paused ? '计时已暂停' : mode === 'countdown' ? `剩余 ${time} 秒` : mode === 'stopwatch' ? `已用 ${elapsed} 秒` : '自由模式 · 随时结束本局';
  $('#timerLabel').textContent = label;
  $('#fuseFill').style.width = mode === 'countdown' ? Math.max(0, time / ROUND_SECONDS * 100) + '%' : '100%';
}

function render() {
  const board = $('#board');
  board.innerHTML = '';
  grid.forEach((row, r) => row.forEach((value, c) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.r = r;
    cell.dataset.c = c;
    if (value === null) cell.classList.add('empty');
    else cell.textContent = value;
    if (isSelected(r, c)) cell.classList.add('selected');
    board.appendChild(cell);
  }));
  if (selectionStart && selectionEnd) {
    const [startRow, startCol] = selectionStart;
    const [endRow, endCol] = selectionEnd;
    const rowMin = Math.min(startRow, endRow);
    const colMin = Math.min(startCol, endCol);
    const rowCount = Math.abs(endRow - startRow) + 1;
    const colCount = Math.abs(endCol - startCol) + 1;
    const cellSize = board.querySelector('.cell').offsetWidth;
    const gap = GRID_GAP;
    const inset = 10;
    const outline = document.createElement('div');
    outline.className = 'selection-outline';
    outline.style.left = `${inset + colMin * (cellSize + gap)}px`;
    outline.style.top = `${inset + rowMin * (cellSize + gap)}px`;
    outline.style.width = `${colCount * cellSize + (colCount - 1) * gap}px`;
    outline.style.height = `${rowCount * cellSize + (rowCount - 1) * gap}px`;
    board.appendChild(outline);
  }
}

function clearEffects() { $('#effectsLayer').replaceChildren(); }
function showTenEffect(effect) {
  const board = $('#board');
  const appRect = document.querySelector('.app').getBoundingClientRect();
  const boardRect = board.getBoundingClientRect();
  const cellSize = board.querySelector('.cell').offsetWidth;
  const badge = document.createElement('div');
  badge.className = 'ten-effect';
  badge.textContent = '10';
  badge.style.left = `${boardRect.left - appRect.left + 10 + (effect.col + .5) * (cellSize + GRID_GAP) - 1.5}px`;
  badge.style.top = `${boardRect.top - appRect.top + 10 + (effect.row + .5) * (cellSize + GRID_GAP) - 1.5}px`;
  $('#effectsLayer').appendChild(badge);
  setTimeout(() => badge.remove(), 800);
}

function selectArea(endRow, endCol) {
  if (!selectionStart) return;
  selectionEnd = [endRow, endCol];
  const [startRow, startCol] = selectionStart;
  const rowMin = Math.min(startRow, endRow);
  const rowMax = Math.max(startRow, endRow);
  const colMin = Math.min(startCol, endCol);
  const colMax = Math.max(startCol, endCol);
  selected = [];
  for (let row = rowMin; row <= rowMax; row += 1) {
    for (let col = colMin; col <= colMax; col += 1) {
      if (grid[row][col] !== null) selected.push([row, col]);
    }
  }
  updateSum();
  render();
}

function finishSelection() {
  if (!drag) return;
  drag = false;
  selectionStart = null;
  selectionEnd = null;
  const sum = selectionSum();
  let effect = null;
  if (selected.length >= 2 && sum === 10) {
    const removed = selected.slice();
    effect = {
      row: removed.reduce((total, [row]) => total + row, 0) / removed.length,
      col: removed.reduce((total, [, col]) => total + col, 0) / removed.length,
    };
    selected.forEach(([row, col]) => { grid[row][col] = null; });
    round += selected.length;
    total += selected.length;
    $('#roundScore').textContent = round;
    $('#totalScore').textContent = total;
    $('#gameRank').textContent = rank(total);
  }
  selected = [];
  updateSum();
  render();
  if (effect) showTenEffect(effect);
}

function start(nextMode = 'default') {
  clearInterval(timer);
  round = 0;
  time = ROUND_SECONDS;
  elapsed = 0;
  mode = nextMode;
  paused = false;
  gameEnded = false;
  $('#settingsPause').textContent = '暂停计时';
  selected = [];
  selectionStart = null;
  selectionEnd = null;
  clearEffects();
  newGrid();
  $('#roundScore').textContent = round;
  $('#gameRank').textContent = rank(total);
  show('game');
  render();
  updateTimer();
  timer = setInterval(() => {
    if (paused) return;
    elapsed += 1;
    if (mode === 'countdown') time -= 1;
    updateTimer();
    if (mode === 'countdown' && time <= 0) end('时间到！');
  }, 1000);
}
function pendingRecords() {
  try { return JSON.parse(localStorage.getItem('sum-ten-pending-records') || '[]'); } catch { return []; }
}
function savePendingRecords(records) { localStorage.setItem('sum-ten-pending-records', JSON.stringify(records)); }
async function flushRecords() {
  const records = pendingRecords();
  if (!records.length) return true;
  if (!navigator.onLine) return false;
  try {
    const response = await fetch('/api/games', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ records }) });
    if (response.ok) { savePendingRecords([]); return true; }
  } catch { /* Keep the local queue for the next connection. */ }
  return false;
}
function recordGame() {
  const records = pendingRecords();
  records.push({ id: crypto.randomUUID(), clientId, mode, score: round, totalScore: total, durationSeconds: elapsed, endedAt: new Date().toISOString() });
  savePendingRecords(records.slice(-20));
  return flushRecords();
}
function end(title = '本局结束！') {
  if (gameEnded) return;
  gameEnded = true;
  clearInterval(timer);
  $('#resultTitle').textContent = title;
  $('#finalRound').textContent = round;
  $('#finalDuration').textContent = `${MODE_LABELS[mode]} · 本局用时：${elapsed} 秒`;
  $('#finalTotal').textContent = total;
  $('#finalRank').textContent = rank(total);
  $('#homeRank').textContent = rank(total);
  show('result');
  $('#finalRecordStatus').textContent = '本局数据已保存在本机，正在同步…';
  lastRecordSync = recordGame().then(synced => {
    $('#finalRecordStatus').textContent = synced ? '✓ 本局数据已同步到历史记录' : '离线中：本局数据会在联网后自动同步';
    return synced;
  });
}
function saveGame() {
  localStorage.setItem('kindergarten-ten-save', JSON.stringify({ grid, round, total, time, elapsed, mode }));
  $('#settingsSave').textContent = '✓ 已保存';
  setTimeout(() => { $('#settingsSave').textContent = '保存进度'; }, 1200);
}
function goHome() {
  clearInterval(timer);
  drag = false;
  selected = [];
  selectionStart = null;
  selectionEnd = null;
  clearEffects();
  show('home');
}
function formatDuration(seconds) { return `${seconds} 秒`; }
async function openLeaderboard() {
  show('leaderboard');
  const list = $('#leaderboardList');
  list.innerHTML = '<div class="leaderboard-empty">正在加载…</div>';
  await lastRecordSync;
  await flushRecords();
  try {
    const response = await fetch('/api/leaderboard');
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error('load failed');
    list.innerHTML = '';
    if (!data.records.length) {
      list.innerHTML = '<div class="leaderboard-empty">还没有已同步的对局记录。</div>';
      return;
    }
    data.records.forEach((record, index) => {
      const row = document.createElement('div');
      row.className = 'leaderboard-row';
      const position = document.createElement('span');
      position.textContent = `#${index + 1}`;
      const details = document.createElement('span');
      details.textContent = MODE_LABELS[record.mode] || '默认模式';
      const time = document.createElement('small');
      time.textContent = `用时 ${formatDuration(record.durationSeconds)}`;
      details.appendChild(time);
      const score = document.createElement('strong');
      score.className = 'leaderboard-score';
      score.textContent = record.score;
      row.append(position, details, score);
      list.appendChild(row);
    });
  } catch {
    list.innerHTML = '<div class="leaderboard-empty">排行榜暂时无法加载，请检查网络后重试。</div>';
  }
}
window.addEventListener('pointerup', finishSelection);
const board = $('#board');
board.addEventListener('pointerdown', event => {
  const cell = event.target.closest('.cell');
  if (!cell || cell.classList.contains('empty')) return;
  event.preventDefault();
  window.getSelection?.().removeAllRanges();
  drag = true;
  selectionStart = [Number(cell.dataset.r), Number(cell.dataset.c)];
  selectionEnd = selectionStart;
  selected = [];
  board.setPointerCapture?.(event.pointerId);
  selectArea(Number(cell.dataset.r), Number(cell.dataset.c));
}, { passive: false });
board.addEventListener('pointermove', event => {
  if (!drag) return;
  event.preventDefault();
  const cell = document.elementFromPoint(event.clientX, event.clientY)?.closest('.cell');
  if (cell) selectArea(Number(cell.dataset.r), Number(cell.dataset.c));
}, { passive: false });
board.addEventListener('contextmenu', event => event.preventDefault());
$('#againBtn').addEventListener('click', () => start(mode));
$('#homeBtn').addEventListener('click', () => show('home'));
$('#defaultBtn').addEventListener('click', () => start('default'));
$('#countdownBtn').addEventListener('click', () => start('countdown'));
$('#stopwatchBtn').addEventListener('click', () => start('stopwatch'));
$('#rulesBtn').addEventListener('click', () => $('#rulesModal').classList.remove('hidden'));
$('#rulesClose').addEventListener('click', () => $('#rulesModal').classList.add('hidden'));
$('#leaderboardBtn').addEventListener('click', () => { void openLeaderboard(); });
$('#leaderboardHome').addEventListener('click', () => show('home'));
$('#resultLeaderboard').addEventListener('click', () => { void openLeaderboard(); });
$('#shuffleBtn').addEventListener('click', () => {
  const values = grid.flat().filter(value => value !== null).sort(() => Math.random() - 0.5);
  grid = grid.map(row => row.map(value => value === null ? null : values.pop()));
  selected = [];
  updateSum();
  render();
});
$('#settingsPause').addEventListener('click', () => {
  paused = !paused;
  $('#settingsPause').textContent = paused ? '继续计时' : '暂停计时';
  updateTimer();
});
$('#settingsBtn').addEventListener('click', () => $('#settingsModal').classList.remove('hidden'));
$('#settingsResume').addEventListener('click', () => $('#settingsModal').classList.add('hidden'));
$('#settingsSave').addEventListener('click', saveGame);
$('#settingsHome').addEventListener('click', () => { $('#settingsModal').classList.add('hidden'); goHome(); });
$('#settingsRestart').addEventListener('click', () => { $('#settingsModal').classList.add('hidden'); start(mode); });
$('#settingsEnd').addEventListener('click', () => { $('#settingsModal').classList.add('hidden'); end('游戏已结束！'); });
$('#loadBtn').addEventListener('click', () => {
  const saved = localStorage.getItem('kindergarten-ten-save');
  if (!saved) { alert('还没有保存过进度。'); return; }
  try {
    const data = JSON.parse(saved);
    if (!Array.isArray(data.grid) || data.grid.length !== ROWS) throw new Error('invalid');
    clearInterval(timer);
    ({ grid, round, total, time, elapsed = 0, mode = 'default' } = data);
    paused = false;
    selected = [];
    clearEffects();
    $('#roundScore').textContent = round;
    $('#totalScore').textContent = total;
    $('#gameRank').textContent = rank(total);
    show('game'); render(); updateSum(); updateTimer();
    gameEnded = false;
    timer = setInterval(() => { if (paused) return; elapsed += 1; if (mode === 'countdown') time -= 1; updateTimer(); if (mode === 'countdown' && time <= 0) end('时间到！'); }, 1000);
  } catch { alert('进度数据无法读取。'); }
});
window.addEventListener('online', () => { void flushRecords(); });
if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
void flushRecords();
$('#homeRank').textContent = rank(total);
</script></body></html>
