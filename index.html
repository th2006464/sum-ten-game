<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>开局托儿所</title>
<style>
:root{--bg:#a9bfca;--ink:#20333a;--green:#78ad82;--green2:#a9d3a6;--yellow:#ffd85a;--cream:#fff8df;--red:#ef735e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:linear-gradient(145deg,#9fb8c4,#c3d2d2);font-family:"Arial Rounded MT Bold","PingFang SC",sans-serif;color:var(--ink);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}body{display:grid;place-items:center}
.app{width:min(100%,520px);height:100dvh;padding:max(12px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;position:relative;overflow:hidden}.screen{display:none;flex:1;min-height:0;flex-direction:column}.screen.active{display:flex}.brand{text-align:center;font-weight:900;font-size:clamp(34px,10vw,52px);letter-spacing:3px;color:#fef8df;text-shadow:3px 4px 0 #54747a,0 0 1px #20333a;margin:18px 0 12px}.duck{font-size:105px;text-align:center;filter:drop-shadow(0 7px 0 #78949a);margin:25px 0}.loading-bar{height:18px;border:3px solid #55757d;border-radius:99px;background:#e4eee6;overflow:hidden;box-shadow:inset 0 2px 3px #79939a}.loading-fill{height:100%;width:0;background:var(--yellow);transition:width .2s}.loading-label{text-align:center;font-weight:700;margin-top:10px}
.topbar{display:flex;justify-content:space-between;align-items:center;background:#e7f0dd;border:3px solid #587a79;border-radius:18px;padding:10px 14px;box-shadow:0 5px 0 #78969a;margin-bottom:14px}.score strong{font-size:25px}.rank{font-weight:900;color:#537d5d;font-size:18px}.panel{background:rgba(255,248,223,.75);border:3px solid #68888a;border-radius:25px;padding:22px;box-shadow:0 6px 0 #829da0}.home .panel{text-align:center;margin-top:25px}.home h2{font-size:27px;margin:0 0 10px}.home p{line-height:1.7;margin:10px 0 24px}.button{border:0;border-bottom:5px solid #b58f2e;border-radius:18px;padding:14px 24px;background:var(--yellow);color:#594b26;font:900 21px inherit;cursor:pointer;box-shadow:0 2px 0 #fff8c1;transition:.12s}.button:active{transform:translateY(3px);border-bottom-width:2px}.small-btn{font-size:15px;padding:9px 12px;border-radius:12px;border-bottom-width:3px}.home-footer{margin-top:auto;display:flex;justify-content:center;gap:10px;padding-top:20px}.secondary{background:#e6f0e4;border-color:#698889;color:var(--ink);border-bottom-color:#718e8a}
.fuse{height:19px;background:#dce9d6;border:3px solid #587a79;border-radius:99px;overflow:hidden;margin-bottom:7px;position:relative;flex:none}.fuse i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ef6f54,#ffd558);transform-origin:left}.fuse:after{content:"✦";position:absolute;right:2px;top:-8px;font-size:23px;color:#fff0a2}.game-score{text-align:center;font-weight:900;margin:-4px 0 7px;flex:none}.timer-label{text-align:center;font-size:14px;font-weight:800;margin-bottom:7px;flex:none}.board{--cell-size:min(calc((100vw - 54px) / 10),calc((100dvh - 290px) / 16),48px);display:grid;grid-template-columns:repeat(10,var(--cell-size));grid-template-rows:repeat(16,var(--cell-size));gap:3px;width:max-content;align-self:center;background:#147a58;padding:6px;border:4px solid #8b6223;border-radius:18px;box-shadow:0 5px 0 #6d8e88;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.cell{width:var(--cell-size);height:var(--cell-size);background:#f9f8e8;border:1px solid #dedcc9;border-radius:3px;display:grid;place-items:center;font-size:clamp(14px,calc(var(--cell-size) * .57),24px);font-weight:900;color:#182527;cursor:pointer;transition:.08s;box-shadow:1px 2px 0 #bdc8bb}.cell.selected{background:#a8b5dd;border-color:#e8efff;transform:scale(.95);box-shadow:0 0 0 2px #4a638d}.cell.empty{background:transparent;border-color:transparent;box-shadow:none;cursor:default}.toolbox{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px;flex:none}.tool{border:2px solid #587a79;border-radius:12px;padding:7px 5px;background:#e8f0df;color:#20333a;font:800 14px inherit;cursor:pointer;box-shadow:0 3px 0 #78969a}.tool:active{transform:translateY(2px);box-shadow:0 1px 0 #78969a}.tool.on{background:#ffd85a}.hint{animation:pulse .55s ease-in-out 3}@keyframes pulse{50%{background:#ffdd56;transform:scale(1.1)}}
@media (max-height:720px){.app{padding-top:8px;padding-bottom:8px}.topbar{padding:7px 12px;margin-bottom:8px}.score strong{font-size:21px}.fuse{height:16px}.toolbox{margin-top:7px}.tool{padding:5px}.game-score,.timer-label{margin-bottom:4px}}
.modal-wrap{position:absolute;inset:0;background:#213c3d88;display:grid;place-items:center;padding:22px;z-index:5}.modal{max-width:420px;background:var(--cream);border:4px solid #587a79;border-radius:25px;padding:25px;box-shadow:0 8px 0 #496c70;text-align:center}.modal h2{margin:0 0 12px}.modal p{line-height:1.75;text-align:left}.result{text-align:center;margin:auto 0}.result .duck{font-size:75px;margin:10px}.result h1{font-size:34px;margin:8px}.result .big{font-size:42px;font-weight:900;color:#bd733d}.actions{display:flex;justify-content:center;gap:10px;margin-top:25px}.hidden{display:none!important}
</style></head>
<body><main class="app">
<section id="loading" class="screen"><div></div></section>
<section id="home" class="screen home active"><div class="topbar"><div class="score">当前智力<br><strong id="totalScore">0</strong></div><div class="rank" id="homeRank">托儿所</div></div><div class="panel"><h2>开局托儿所</h2><p>框选相邻数字，让它们的总和等于 <b>10</b>。选得越多，分数越高！</p><button class="button" id="startBtn" onclick="start(false)">限时挑战</button><p style="margin:16px 0 0"><button class="button secondary small-btn" id="infiniteBtn">无限时间模式</button> <button class="button secondary small-btn" id="loadBtn">读取进度</button></p></div></section>
<section id="game" class="screen"><div class="topbar"><div class="score">当前智力<br><strong id="roundScore">0</strong></div><div class="rank" id="gameRank">托儿所</div></div><div class="fuse"><i id="fuseFill"></i></div><div class="timer-label" id="timerLabel">剩余 60 秒</div><div class="game-score">连续框选相邻数字 · 总和：<span id="selectionSum">0</span></div><div class="board" id="board"></div><div class="toolbox"><button class="tool" id="shuffleBtn">🔀 洗牌</button><button class="tool" id="pauseBtn">⏸ 暂停计时</button><button class="tool" id="saveBtn">💾 保存进度</button><button class="tool" id="restartBtn">↻ 重新开始</button></div></section>
<section id="result" class="screen result"><div class="duck">🐥</div><h1>时间到！</h1><p>本局智力</p><div class="big" id="finalRound">0</div><p>总智力：<b id="finalTotal">0</b><br>学历称号：<b id="finalRank">托儿所</b></p><div class="actions"><button class="button" id="againBtn">再来一局</button><button class="button secondary" id="homeBtn">返回首页</button></div></section>
</main><script>
const $ = s => document.querySelector(s);
const screens = [...document.querySelectorAll('.screen')];
const ROWS = 16, COLS = 10, ROUND_SECONDS = 60;
let grid = [], selected = [], drag = false, round = 0, total = 0, time = ROUND_SECONDS, timer = null, infinite = false, paused = false;

const rank = score => score < 100 ? '托儿所' : score < 300 ? '小学' : score < 600 ? '中学' : '大学';
function show(id) { screens.forEach(screen => screen.classList.toggle('active', screen.id === id)); }
function newGrid() { grid = Array.from({ length: ROWS }, () => Array.from({ length: COLS }, () => 1 + Math.floor(Math.random() * 9))); }
function isSelected(row, col) { return selected.some(([r, c]) => r === row && c === col); }
function selectionSum() { return selected.reduce((sum, [row, col]) => sum + grid[row][col], 0); }
function updateSum() { $('#selectionSum').textContent = selectionSum(); }
function updateTimer() {
  $('#timerLabel').textContent = infinite ? '无限时间' : paused ? '计时已暂停' : `剩余 ${time} 秒`;
  $('#fuseFill').style.width = infinite ? '100%' : Math.max(0, time / ROUND_SECONDS * 100) + '%';
}

function render() {
  const board = $('#board');
  board.innerHTML = '';
  grid.forEach((row, r) => row.forEach((value, c) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.r = r;
    cell.dataset.c = c;
    if (value === null) cell.classList.add('empty');
    else cell.textContent = value;
    if (isSelected(r, c)) cell.classList.add('selected');
    board.appendChild(cell);
  }));
}

function addCell(row, col) {
  if (grid[row][col] === null || isSelected(row, col)) return;
  const [lastRow, lastCol] = selected[selected.length - 1];
  if (Math.abs(lastRow - row) + Math.abs(lastCol - col) !== 1) return;
  selected.push([row, col]);
  updateSum();
  render();
}

function finishSelection() {
  if (!drag) return;
  drag = false;
  const sum = selectionSum();
  if (selected.length >= 2 && sum === 10) {
    selected.forEach(([row, col]) => { grid[row][col] = null; });
    round += selected.length;
    total += selected.length;
    $('#roundScore').textContent = round;
    $('#totalScore').textContent = total;
    $('#gameRank').textContent = rank(total);
  }
  selected = [];
  updateSum();
  render();
}

function start(isInfinite = false) {
  clearInterval(timer);
  round = 0;
  time = ROUND_SECONDS;
  infinite = isInfinite;
  paused = false;
  $('#pauseBtn').textContent = '⏸ 暂停计时';
  $('#pauseBtn').classList.remove('on');
  selected = [];
  newGrid();
  $('#roundScore').textContent = round;
  $('#gameRank').textContent = rank(total);
  show('game');
  render();
  updateTimer();
  timer = setInterval(() => {
    if (infinite || paused) return;
    time -= 1;
    updateTimer();
    if (time <= 0) end();
  }, 1000);
}
function end() {
  clearInterval(timer);
  $('#finalRound').textContent = round;
  $('#finalTotal').textContent = total;
  $('#finalRank').textContent = rank(total);
  $('#homeRank').textContent = rank(total);
  show('result');
}
window.addEventListener('pointerup', finishSelection);
const board = $('#board');
board.addEventListener('pointerdown', event => {
  const cell = event.target.closest('.cell');
  if (!cell || cell.classList.contains('empty')) return;
  event.preventDefault();
  window.getSelection?.().removeAllRanges();
  drag = true;
  selected = [[Number(cell.dataset.r), Number(cell.dataset.c)]];
  board.setPointerCapture?.(event.pointerId);
  updateSum();
  render();
}, { passive: false });
board.addEventListener('pointermove', event => {
  if (!drag) return;
  event.preventDefault();
  const cell = document.elementFromPoint(event.clientX, event.clientY)?.closest('.cell');
  if (cell) addCell(Number(cell.dataset.r), Number(cell.dataset.c));
}, { passive: false });
board.addEventListener('contextmenu', event => event.preventDefault());
$('#againBtn').addEventListener('click', () => start(false));
$('#homeBtn').addEventListener('click', () => show('home'));
$('#infiniteBtn').addEventListener('click', () => start(true));
$('#shuffleBtn').addEventListener('click', () => {
  const values = grid.flat().filter(value => value !== null).sort(() => Math.random() - 0.5);
  grid = grid.map(row => row.map(value => value === null ? null : values.pop()));
  selected = [];
  updateSum();
  render();
});
$('#pauseBtn').addEventListener('click', () => {
  if (infinite) return;
  paused = !paused;
  $('#pauseBtn').textContent = paused ? '▶ 继续计时' : '⏸ 暂停计时';
  $('#pauseBtn').classList.toggle('on', paused);
  updateTimer();
});
$('#saveBtn').addEventListener('click', () => {
  localStorage.setItem('kindergarten-ten-save', JSON.stringify({ grid, round, total, time, infinite }));
  $('#saveBtn').textContent = '✓ 已保存';
  setTimeout(() => { $('#saveBtn').textContent = '💾 保存进度'; }, 1200);
});
$('#loadBtn').addEventListener('click', () => {
  const saved = localStorage.getItem('kindergarten-ten-save');
  if (!saved) { alert('还没有保存过进度。'); return; }
  try {
    const data = JSON.parse(saved);
    if (!Array.isArray(data.grid) || data.grid.length !== ROWS) throw new Error('invalid');
    clearInterval(timer);
    ({ grid, round, total, time, infinite } = data);
    paused = false;
    selected = [];
    $('#roundScore').textContent = round;
    $('#totalScore').textContent = total;
    $('#gameRank').textContent = rank(total);
    show('game'); render(); updateSum(); updateTimer();
    timer = setInterval(() => { if (infinite || paused) return; time -= 1; updateTimer(); if (time <= 0) end(); }, 1000);
  } catch { alert('进度数据无法读取。'); }
});
$('#restartBtn').addEventListener('click', () => start(infinite));
$('#homeRank').textContent = rank(total);
</script></body></html>
